apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  orders-app.json: |
    {
      "title": "Orders App",
      "uid": "orders-app",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Orders per second by status",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(orders_total[1m])) by (status)", "legendFormat": "{{status}}" }
          ]
        },
        {
          "type": "stat",
          "title": "Failure rate",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.1 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "sum(rate(orders_total{status=\"failed\"}[2m])) / sum(rate(orders_total[2m]))" }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 order processing time",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(order_processing_seconds_bucket[5m])) by (le))", "legendFormat": "p95" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Orders in queue (per pod)",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "orders_in_queue", "legendFormat": "{{pod}}" }
          ]
        }
      ]
    }
