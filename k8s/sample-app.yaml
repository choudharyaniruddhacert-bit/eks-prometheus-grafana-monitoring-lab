apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-app-code
  namespace: demo
data:
  app.py: |
    import os, random, time
    from prometheus_client import start_http_server, Counter, Histogram, Gauge

    ORDERS  = Counter("orders", "Total orders processed", ["status"])
    LATENCY = Histogram("order_processing_seconds", "Time to process an order",
                        buckets=[0.1, 0.25, 0.5, 1, 2, 5])
    QUEUE   = Gauge("orders_in_queue", "Orders waiting in queue")

    FAIL_RATE = float(os.getenv("FAIL_RATE", "0.05"))

    if __name__ == "__main__":
        start_http_server(8000)
        print(f"Metrics on :8000/metrics, FAIL_RATE={FAIL_RATE}")
        while True:
            QUEUE.set(random.randint(0, 20))
            with LATENCY.time():
                time.sleep(random.uniform(0.05, 1.5))
            status = "failed" if random.random() < FAIL_RATE else "success"
            ORDERS.labels(status=status).inc()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-app
  template:
    metadata:
      labels:
        app: orders-app
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["sh", "-c", "pip install --no-cache-dir prometheus_client && python /app/app.py"]
          env:
            - name: FAIL_RATE
              value: "0.05"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: orders-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: orders-app
  namespace: demo
  labels:
    app: orders-app
spec:
  selector:
    app: orders-app
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
