apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-app
  namespace: demo
  labels:
    release: monitoring   # works even with the chart's default (strict) selector
spec:
  selector:
    matchLabels:
      app: orders-app
  namespaceSelector:
    matchNames:
      - demo
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
